version: "3"

tasks:
  install_backend:
    dir: backend
    cmds:
      - uv sync
    sources:
      - pyproject.toml
      - uv.lock
      - wolwm/**/*.py
      - wolwm/ui/**/*

  backend:
    deps: [install_backend]
    dir: backend
    cmds:
      - uv run wolwm -dev -v

  dev:
    deps: [install_backend]
    dir: backend
    cmds:
      - uv run wolwm -dev -v

  build:
    deps: [install_backend]
    dir: backend
    cmds:
      - uv build
