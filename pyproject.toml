[project]
name = "wolwm"
version = "0.2.4"
description = ""
authors = [
    { name = "thelicato", email = "thelicato@duck.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer==0.24.2",
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "structlog==25.5.0",
    "sqlalchemy==2.0.50",
    "idna==3.18",
    "wakeonlan==3.3.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.scripts]
wolwm = "wolwm.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"wolwm" = ["ui/**/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wolwm*"]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"
