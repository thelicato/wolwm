{% import "_icons.html" as icons %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f2937">
    <title>{{ title }} · wolwm</title>
    <link rel="icon" href="/ui/static/favicon.ico">
    <link rel="manifest" href="/ui/static/manifest.json">
    <link rel="stylesheet" href="/ui/static/app.css">
    <script src="/ui/static/app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/ui/" aria-label="wolwm home">
        <img src="/ui/static/logo.png" alt="">
        <span>wolwm</span>
      </a>

      <div class="header-actions">
        <button
          class="header-action"
          type="button"
          data-theme-toggle
          title="Toggle color theme"
          aria-label="Toggle color theme"
        >
          {{ icons.moon("theme-icon theme-icon--moon") }}
          {{ icons.sun("theme-icon theme-icon--sun") }}
        </button>
        <button
          class="header-action menu-toggle"
          type="button"
          data-nav-toggle
          aria-controls="side-navigation"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          {{ icons.menu() }}
        </button>
      </div>
    </header>

    <div class="app-layout">
      <div class="nav-shell" data-nav-shell>
        <nav class="side-nav" id="side-navigation" aria-label="Main navigation">
          <ul>
            <li>
              <a
                href="/ui/"
                class="nav-link{% if active_page == 'devices' %} is-active{% endif %}"
                {% if active_page == "devices" %}aria-current="page"{% endif %}
                title="Devices"
              >
                {{ icons.devices() }}
                <span>Devices</span>
              </a>
            </li>
            <li>
              <a
                href="/ui/events"
                class="nav-link{% if active_page == 'events' %} is-active{% endif %}"
                {% if active_page == "events" %}aria-current="page"{% endif %}
                title="Events"
              >
                {{ icons.events() }}
                <span>Events</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    <div
      class="toast toast--{{ notice_kind }}"
      role="status"
      aria-live="polite"
      {% if notice %}data-toast-visible{% endif %}
    >
      {{ notice }}
    </div>

    <div class="loading-overlay" data-loading-overlay aria-hidden="true">
      <div class="loading-box">
        <svg class="spinner" viewBox="0 0 100 101" role="status" aria-label="Loading">
          <path
            class="spinner-track"
            d="M100 50.6C100 78.2 77.6 100.6 50 100.6S0 78.2 0 50.6 22.4.6 50 .6s50 22.4 50 50Zm-90.9 0A40.9 40.9 0 1 0 91 50.6a40.9 40.9 0 0 0-81.9 0Z"
          />
          <path
            class="spinner-head"
            d="M94 39c2.4-.6 3.9-3.1 3-5.5A50 50 0 0 0 41.7 1.3c-2.5.4-3.9 2.9-3.3 5.3.7 2.4 3.1 3.8 5.6 3.5A41 41 0 0 1 93.9 39Z"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
